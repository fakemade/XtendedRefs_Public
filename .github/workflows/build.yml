name: Build & Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия сборки (например, 1.2.0 или 1.2.0.0)'
        required: true
        type: string
      configuration:
        description: 'Конфигурация сборки'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_release:
        description: 'Опубликовать в GitHub Releases (иначе только артефакт)'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Пометить релиз как Pre-release (бета-версия)'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Дополнительный комментарий к релизу (необязательно)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Resolve version ─────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim().TrimStart('v')
          if ($raw -match '^\d+\.\d+\.\d+$') {
            $ver = "$raw.0"
          } elseif ($raw -match '^\d+\.\d+\.\d+\.\d+$') {
            $ver = $raw
          } else {
            throw "Неверный формат версии: '$raw'. Используйте формат X.Y.Z или X.Y.Z.W"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $ver"

      # ── Setup MSBuild ────────────────────────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Setup .NET (только для restore) ──────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # ── Restore packages ─────────────────────────────────────────────────────
      - name: Restore packages
        shell: pwsh
        run: dotnet restore XtendedRefs.ComAddIn.csproj

      # ── Build x86 ────────────────────────────────────────────────────────────
      - name: Build x86
        shell: pwsh
        run: |
          msbuild XtendedRefs.ComAddIn.csproj `
            /p:Configuration=${{ inputs.configuration }} `
            /p:PlatformTarget=x86 `
            /p:OutputPath=Installer\bin\x86 `
            /p:AssemblyVersion=${{ steps.version.outputs.version }} `
            /p:FileVersion=${{ steps.version.outputs.version }} `
            /t:Rebuild

      # ── Build x64 ────────────────────────────────────────────────────────────
      - name: Build x64
        shell: pwsh
        run: |
          msbuild XtendedRefs.ComAddIn.csproj `
            /p:Configuration=${{ inputs.configuration }} `
            /p:PlatformTarget=x64 `
            /p:OutputPath=Installer\bin\x64 `
            /p:AssemblyVersion=${{ steps.version.outputs.version }} `
            /p:FileVersion=${{ steps.version.outputs.version }} `
            /t:Rebuild

      # ── Remove PDB files (только для Release) ────────────────────────────────
      - name: Remove PDB files
        if: inputs.configuration == 'Release'
        shell: pwsh
        run: |
          Remove-Item Installer\bin\x86\*.pdb -ErrorAction SilentlyContinue
          Remove-Item Installer\bin\x64\*.pdb -ErrorAction SilentlyContinue

      # ── Install Inno Setup ───────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # ── Compile installer ────────────────────────────────────────────────────
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" |
                  Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using: $iscc"
          & $iscc /DBuildVersion="${{ steps.version.outputs.version }}" Installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      # ── Upload installers as artifacts ───────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.version }}-${{ inputs.configuration }}
          path: Installer/bin/XtendedRefsInstaller.exe
          if-no-files-found: error

      # ── Create GitHub Release (если отмечена галочка) ────────────────────────
      - name: Create Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: XtendedRefs ${{ steps.version.outputs.version }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.is_prerelease }}
          files: Installer/bin/XtendedRefsInstaller.exe
          generate_release_notes: true
